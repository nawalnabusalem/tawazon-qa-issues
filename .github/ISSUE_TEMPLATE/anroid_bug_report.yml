name: Android Bug Report
description: Comprehensive bug report for Android with severity, environment, and reproduction probability
title: "[Bug][Android] "
labels: ["bug", "Android", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 Bug Report
        Thanks for taking the time to fill out this bug report. The more details, the faster we can fix it!

  - type: dropdown
    id: severity
    attributes:
      label: Severity (Required)
      description: How severe is this bug?
      options:
        - 🔴 Critical - App crash, data loss, major feature broken
        - 🟠 High - Feature unusable, no workaround
        - 🟡 Medium - Feature partially broken, workaround exists
        - 🟢 Low - Minor UI glitch, typo, cosmetic issue
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device Model (Required)
      description: e.g., Samsung Galaxy S23, Pixel 8 Pro
      placeholder: Enter device name
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android Version (Required)
      placeholder: e.g., Android 14, Android 13
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version (Required)
      placeholder: e.g., v2.1.3 (build 47)
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction Frequency (Required)
      options:
        - Always (100%)
        - Frequently (70-99%)
        - Occasionally (30-69%)
        - Rarely (<30%)
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce (Required)
      description: Provide clear, numbered steps
      placeholder: |
        1. Launch the app
        2. Navigate to Profile → Settings
        3. Tap on "Change Password."
        4. Enter new password and confirm
        5. Observe error message appears
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior (Required)
      placeholder: Password should be updated successfully, and the user should receive confirmation
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior (Required)
      placeholder: Error "Something went wrong" appears, password not changed
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logcat / Crash Logs (Optional)
      description: Paste relevant log entries or attach log file
      placeholder: |
        2025-01-09 14:32:10.123 E/AndroidRuntime: FATAL EXCEPTION: main
        java.lang.NullPointerException: ...

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recording (Optional)
      description: Drag & drop images/videos or provide a Google Drive link
      placeholder: Drag files here or paste a link

  - type: checkboxes
    id: environment
    attributes:
      label: Environment Check (Required)
      options:
        - label: Issue occurs on clean install (no data/cache)
        - label: Issue occurs after force stop & restart
        - label: Issue occurs on different network (WiFi vs Mobile)
        - label: Issue occurs on multiple devices (if tested)
